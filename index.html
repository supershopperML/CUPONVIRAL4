<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cupón Viral ML — Cupones de Mercado Libre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ml-yellow: #FFF44F;
    --ml-yellow-soft: #FFF176;
    --ml-blue: #2968F5;
    --ml-blue-bright: #3B8CFF;
    --ml-cyan: #29E7F5;
    --bg-deep: #060A18;
    --bg-panel: #0D1430;
    --glass: rgba(255,255,255,0.05);
    --glass-border: rgba(255,255,255,0.10);
    --text-hi: #F5F7FF;
    --text-mid: #9CA6C7;
    --text-dark: #121829;
    --text-dark-muted: #3D485C;
    --danger: #D90429;
    --radius: 18px;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}

  body{
    background: var(--bg-deep);
    color: var(--text-hi);
    font-family:'Inter',sans-serif;
    overflow-x:hidden;
    position:relative;
    min-height:100vh;
  }

  body::before{
    content:"";
    position:fixed; inset:0;
    background:
      radial-gradient(circle at 15% 10%, rgba(41,104,245,0.25), transparent 40%),
      radial-gradient(circle at 85% 0%, rgba(255,230,0,0.10), transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(41,231,245,0.10), transparent 40%);
    pointer-events:none;
    z-index:0;
  }

  /* ---------- Lluvia de cupones de fondo ---------- */
  #coupon-rain{
    position:fixed; inset:0;
    overflow:hidden;
    z-index:1;
    pointer-events:none;
  }
  .drop{
    position:absolute;
    top:-60px;
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    color: rgba(255,230,0,0.16);
    white-space:nowrap;
    animation-name: fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    user-select:none;
  }
  .drop.blue{ color: rgba(59,140,255,0.18); }
  .drop.cyan{ color: rgba(41,231,245,0.14); }
  @keyframes fall{
    0%{ transform: translateY(-10vh) rotate(0deg); opacity:0; }
    8%{ opacity:1; }
    92%{ opacity:1; }
    100%{ transform: translateY(110vh) rotate(25deg); opacity:0; }
  }

  /* ---------- Layout general ---------- */
  .wrap{
    position:relative;
    z-index:2;
    max-width:1180px;
    margin:0 auto;
    padding: 28px 24px 80px;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding-bottom:8px;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:1.15rem;
    letter-spacing:0.02em;
  }
  .brand-dot{
    width:12px;height:12px;border-radius:50%;
    background: var(--ml-yellow);
    box-shadow: 0 0 14px 4px rgba(255,230,0,0.7);
  }
  .brand span{ color: var(--ml-yellow); }

  nav.top-badge{
    font-size:0.78rem;
    color: var(--text-mid);
    border:1px solid var(--glass-border);
    background: var(--glass);
    padding:8px 14px;
    border-radius:999px;
    backdrop-filter: blur(6px);
  }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    display:grid;
    grid-template-columns: 1.1fr 0.9fr;
    align-items:center;
    gap:32px;
    padding: 48px 0 40px;
  }
  .hero-copy .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:0.75rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color: var(--ml-cyan);
    background: rgba(41,231,245,0.08);
    border:1px solid rgba(41,231,245,0.35);
    padding:6px 12px;
    border-radius:999px;
    margin-bottom:18px;
  }
  .hero-copy h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size: clamp(2.2rem, 4.6vw, 3.6rem);
    line-height:1.05;
    letter-spacing:-0.01em;
  }
  .hero-copy h1 em{
    font-style:normal;
    color: var(--bg-deep);
    background: linear-gradient(100deg, var(--ml-yellow), var(--ml-yellow-soft));
    padding:0 10px;
    border-radius:8px;
    box-shadow: 0 0 40px rgba(255,230,0,0.35);
  }
  .hero-copy p{
    margin-top:16px;
    color: var(--text-mid);
    font-size:1.02rem;
    max-width:46ch;
    line-height:1.55;
  }
  .hero-stats{
    display:flex; gap:26px;
    margin-top:28px;
  }
  .hero-stats div{ text-align:left; }
  .hero-stats b{
    display:block;
    font-family:'Space Grotesk',sans-serif;
    font-size:1.5rem;
    color: var(--ml-yellow);
  }
  .hero-stats span{
    font-size:0.75rem;
    color: var(--text-mid);
  }

  .hero-figure{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
  }
  .hero-image {
    width: 100%;
    max-width: 360px;
    height: auto;
    border-radius: var(--radius);
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    border: 3px solid rgba(255,255,255,0.1);
    animation: float 6s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{ transform: translateY(0px); }
    50%{ transform: translateY(-12px); }
  }

  /* ---------- Controles: buscar + categorías ---------- */
  .controls{
    position:sticky;
    top:14px;
    z-index:5;
    background: rgba(13,20,48,0.75);
    border:1px solid var(--glass-border);
    backdrop-filter: blur(14px);
    border-radius: var(--radius);
    padding:16px;
    margin-bottom:30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  .search-row{
    display:flex; gap:10px;
  }
  .search-row input{
    flex:1;
    background: rgba(255,255,255,0.04);
    border:1px solid var(--glass-border);
    color: var(--text-hi);
    padding:13px 16px;
    border-radius:12px;
    font-size:0.95rem;
    outline:none;
    transition: border-color .2s, box-shadow .2s;
  }
  .search-row input::placeholder{ color: var(--text-mid); }
  .search-row input:focus{
    border-color: var(--ml-cyan);
    box-shadow: 0 0 0 3px rgba(41,231,245,0.15);
  }
  .search-row .count{
    display:flex; align-items:center;
    font-family:'JetBrains Mono',monospace;
    font-size:0.8rem;
    color: var(--text-mid);
    padding:0 6px;
    white-space:nowrap;
  }
  .cats{
    display:flex; flex-wrap:wrap; gap:8
