<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cupones Mercado Libre</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap');

  :root{
    --bg-1:#050A1F;
    --bg-2:#0B1642;
    --bg-3:#12123A;
    --blue:#3E7BFA;
    --blue-glow:rgba(62,123,250,0.55);
    --violet:#8B5CF6;
    --gold:#FFC533;
    --gold-deep:#E2A600;
    --gold-glow:rgba(255,197,51,0.45);
    --ink:#EAF1FF;
    --muted:#93A5D1;
    --card:rgba(16,22,56,0.72);
    --card-border:rgba(139,124,255,0.35);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }

  body{
    background-color:var(--bg-1);
    background-image:
      radial-gradient(circle at 18% 15%, rgba(139,92,246,0.28), transparent 42%),
      radial-gradient(circle at 85% 12%, rgba(62,123,250,0.30), transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(255,197,51,0.14), transparent 50%),
      radial-gradient(circle 22px at 10% 22%, var(--gold-glow) 0 40%, transparent 70%),
      radial-gradient(circle 14px at 30% 55%, var(--gold-glow) 0 40%, transparent 70%),
      radial-gradient(circle 26px at 55% 10%, var(--gold-glow) 0 38%, transparent 68%),
      radial-gradient(circle 12px at 75% 35%, var(--gold-glow) 0 40%, transparent 70%),
      radial-gradient(circle 20px at 92% 70%, var(--gold-glow) 0 38%, transparent 68%),
      radial-gradient(circle 16px at 15% 80%, var(--gold-glow) 0 40%, transparent 70%),
      radial-gradient(circle 24px at 45% 65%, var(--gold-glow) 0 38%, transparent 68%),
      radial-gradient(circle 10px at 65% 88%, var(--gold-glow) 0 40%, transparent 70%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
    background-repeat:no-repeat, no-repeat, no-repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, no-repeat;
    background-size: 100% 100%, 100% 100%, 100% 100%, 520px 520px, 520px 520px, 520px 520px, 520px 520px, 520px 520px, 520px 520px, 520px 520px, 520px 520px, 100% 100%;
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:44px 20px 90px;
  }

  header{
    max-width:1000px;
    margin:0 auto 48px;
    text-align:center;
  }

  .banner-frame{
    max-width:560px;
    margin:0 auto 30px;
    padding:5px;
    border-radius:24px;
    background:linear-gradient(135deg, var(--gold) 0%, var(--violet) 55%, var(--blue) 100%);
    box-shadow:0 0 60px -10px var(--blue-glow), 0 0 40px -12px var(--gold-glow);
  }

  .banner{
    width:100%;
    display:block;
    border-radius:20px;
  }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:700;
    margin-bottom:14px;
    text-shadow:0 0 18px var(--gold-glow);
  }

  h1{
    font-family:'Orbitron', sans-serif;
    font-weight:900;
    font-size:clamp(32px, 5.5vw, 54px);
    line-height:1.08;
    margin:0 0 14px;
    background:linear-gradient(100deg, #FFFFFF 0%, #BFD3FF 45%, var(--gold) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  header p{
    color:var(--muted);
    font-size:15.5px;
    max-width:480px;
    margin:0 auto;
  }

  .grid{
    max-width:1160px;
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
    gap:26px;
  }

  .coupon{
    position:relative;
    background:var(--card);
    backdrop-filter:blur(10px);
    border-radius:20px;
    border:1px solid var(--card-border);
    padding:22px 22px 24px;
    text-align:left;
    cursor:pointer;
    font-family:inherit;
    display:flex;
    flex-direction:column;
    gap:16px;
    box-shadow:0 16px 40px -20px rgba(0,0,0,0.7);
    opacity:0;
    transform:translateY(14px);
    animation:rise 0.5s ease forwards;
    transition:box-shadow 0.25s ease, border-color 0.25s ease, transform 0.18s ease;
  }

  .coupon::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:20px;
    padding:1px;
    background:linear-gradient(140deg, var(--violet), transparent 40%, var(--blue) 75%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    opacity:0;
    transition:opacity 0.25s ease;
    pointer-events:none;
  }

  .coupon:hover{
    border-color:transparent;
    box-shadow:0 0 0 1px var(--blue-glow), 0 22px 50px -18px rgba(0,0,0,0.85), 0 0 40px -10px var(--blue-glow);
    transform:translateY(-3px);
  }

  .coupon:hover::before{ opacity:1; }

  .coupon:focus-visible{
    outline:3px solid var(--gold);
    outline-offset:2px;
  }

  @keyframes rise{ to{ opacity:1; transform:translateY(0); } }

  .badge{
    align-self:flex-start;
    background:linear-gradient(100deg, var(--gold), var(--gold-deep));
    color:#241800;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:0.12em;
    padding:5px 11px;
    border-radius:999px;
    box-shadow:0 4px 14px -4px var(--gold-glow);
  }

  .title{
    font-family:'Orbitron', sans-serif;
    font-weight:600;
    font-size:16.5px;
    color:var(--ink);
    line-height:1.3;
  }

  .code-wrap{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:rgba(2,6,20,0.65);
    border:1px solid rgba(255,197,51,0.18);
    border-radius:12px;
    padding:13px 15px;
  }

  .code{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:16px;
    color:var(--gold);
    letter-spacing:0.08em;
    filter:blur(5px);
    text-shadow:0 0 0 transparent;
    transition:filter 0.25s ease, text-shadow 0.25s ease;
    user-select:none;
  }

  .coupon.revealed .code{
    filter:blur(0);
    text-shadow:0 0 16px var(--gold-glow);
  }

  .hint{
    font-family:'JetBrains Mono', monospace;
    font-size:9.5px;
    color:var(--muted);
    letter-spacing:0.06em;
    white-space:nowrap;
    flex-shrink:0;
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:30px;
    transform:translate(-50%, 20px);
    background:linear-gradient(100deg, var(--violet), var(--blue));
    color:#fff;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:13px;
    padding:13px 24px;
    border-radius:999px;
    box-shadow:0 16px 36px -12px rgba(0,0,0,0.6), 0 0 30px -8px var(--blue-glow);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease, transform 0.25s ease;
    z-index:10;
    white-space:nowrap;
  }

  .toast.show{ opacity:1; transform:translate(-50%, 0); }

  .error-box{
    max-width:600px;
    margin:0 auto;
    background:rgba(120,20,20,0.25);
    border:2px dashed #FF6B4A;
    border-radius:14px;
    padding:20px;
    color:#FFD9CC;
    font-size:14px;
    text-align:center;
  }

  footer{
    max-width:1160px;
    margin:60px auto 0;
    text-align:center;
    color:var(--muted);
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
  }

  @media (prefers-reduced-motion: reduce){
    .coupon{ animation:none !important; opacity:1 !important; transform:none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="banner-frame">
    <img class="banner" src="banner.jpg" alt="Cupones disponibles de Mercado Libre">
  </div>
  <div class="eyebrow">Cupones activos // actualizado a diario</div>
  <h1>Toca. Desbloquea. Ahorra.</h1>
  <p>Cada código está oculto hasta que lo tocas: se descubre, se copia solo y te lleva directo a Mercado Libre.</p>
</header>

<div class="grid" id="grid"></div>

<footer>Los cupones se editan en cupones.json · nada de código que tocar</footer>

<div class="toast" id="toast">¡Cupón copiado!</div>

<script>
  const CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

  function mascara(codigo){
    if (codigo.length <= 4) return "•".repeat(codigo.length);
    return codigo.slice(0,2) + "•".repeat(codigo.length - 4) + codigo.slice(-2);
  }

  function randomStr(len){
    let s = "";
    for (let i=0; i<len; i++) s += CHARS[Math.floor(Math.random()*CHARS.length)];
    return s;
  }

  function crearTarjeta(cup, linkDefault, index){
    const el = document.createElement('button');
    el.className = 'coupon';
    el.style.animationDelay = (index * 0.05) + 's';
    el.setAttribute('aria-label', `Revelar y copiar cupón para ${cup.titulo}`);

    const link = (cup.link && cup.link.trim()) ? cup.link.trim() : linkDefault;

    el.innerHTML = `
      <div class="badge">CUPÓN ACTIVO</div>
      <div class="title">${cup.titulo}</div>
      <div class="code-wrap">
        <span class="code" id="code-${index}">${mascara(cup.codigo)}</span>
        <span class="hint">TOCA</span>
      </div>
    `;

    let revealed = false;

    el.addEventListener('click', async () => {
      const codeEl = document.getElementById(`code-${index}`);
      const toast = document.getElementById('toast');

      if (!revealed){
        revealed = true;
        el.classList.add('revealed');
        let ticks = 0;
        const maxTicks = 12;
        const timer = setInterval(() => {
          ticks++;
          if (ticks < maxTicks){
            codeEl.textContent = randomStr(cup.codigo.length);
          } else {
            clearInterval(timer);
            codeEl.textContent = cup.codigo;
            copiarYRedirigir();
          }
        }, 45);
      } else {
        codeEl.textContent = cup.codigo;
        copiarYRedirigir();
      }

      async function copiarYRedirigir(){
        try{ await navigator.clipboard.writeText(cup.codigo); }catch(e){}
        toast.textContent = `¡Cupón ${cup.codigo} copiado!`;
        toast.classList.add('show');
        setTimeout(() => {
          window.open(link, '_blank', 'noopener');
          toast.classList.remove('show');
        }, 500);
      }
    });

    return el;
  }

  async function cargarCupones(){
    const grid = document.getElementById('grid');
    try{
      const res = await fetch('cupones.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('No se pudo leer cupones.json');
      const data = await res.json();
      const linkDefault = data.linkAfiliadoPredeterminado;

      data.cupones.forEach((cup, i) => {
        grid.appendChild(crearTarjeta(cup, linkDefault, i));
      });
    }catch(err){
      grid.innerHTML = `
        <div class="error-box">
          No se pudieron cargar los cupones desde <b>cupones.json</b>.<br><br>
          Esto pasa si abres el archivo directamente desde tu computadora (file://).
          Sube estos 3 archivos (index.html, cupones.json, banner.jpg) a un hosting
          como Netlify o GitHub Pages, o pruébalo con un servidor local.
        </div>`;
    }
  }

  cargarCupones();
</script>

</body>
</html>
